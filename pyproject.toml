# See https://packaging.python.org/en/latest/guides/writing-pyproject-toml/


[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "setup-py"
description = "Set up a Python library skeleton"
authors = [
    {name="Richard LeBer", email = "richard.leber@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  # TODO complete
]

[project.scripts] 
setup-py = "setup_py:main"

# [project.urls] # TODO Complete or remove
# Homepage = "url"
# Documentation = "url"
# Repository = "url"
# Etc. See https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#urls

[tool.setuptools.dynamic]
version = {attr = "setup_py.__version__"}